<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>espenhk</title>
<meta name="description" content="Every GitHub Pages site published by espenhk">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #e0e0e0;
    --card: #fafafa;
    --accent: #2471a3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181c;
      --fg: #eaeaea;
      --muted: #9aa0a6;
      --border: #2a2f34;
      --card: #1a1f24;
      --accent: #6fb3e0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    padding: 2rem 16px 3rem;
    max-width: 640px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  p.sub { color: var(--muted); margin: 0 0 2rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li + li { margin-top: 0.75rem; }
  a.card {
    display: block;
    padding: 1rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    text-decoration: none;
    color: var(--fg);
  }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); }
  a.card:active { background: var(--border); }
  .name { font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
  .desc { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; }
  .meta { color: var(--muted); font-size: 0.8rem; margin-top: 0.4rem; overflow-wrap: anywhere; }
  .status { color: var(--muted); }
  .status button {
    font: inherit;
    margin-left: 0.5rem;
    padding: 0.25rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--fg);
  }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.8rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<h1>espenhk</h1>
<p class="sub">Sites published with GitHub Pages. Tap one to open it.</p>
<p class="status" id="status">Loading…</p>
<ul id="sites"></ul>
<footer>
  This list builds itself from every public repo with Pages turned on.
  Add the topic <code>unlisted</code> to a repo to hide it.
  <br><a href="https://github.com/espenhk">github.com/espenhk</a>
</footer>
<script>
  const USER = "espenhk";
  const SELF = `${USER}.github.io`;
  const CACHE_KEY = "ghio:repos";
  const CACHE_MS = 60 * 60 * 1000;

  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("sites");

  function readCache() {
    try {
      const hit = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (hit && Date.now() - hit.at < CACHE_MS) return hit.repos;
    } catch (e) {}
    return null;
  }

  function writeCache(repos) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), repos })); } catch (e) {}
  }

  async function fetchRepos() {
    const all = [];
    for (let page = 1; ; page++) {
      const res = await fetch(`https://api.github.com/users/${USER}/repos?per_page=100&page=${page}`,
                              { headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) throw new Error(res.status === 403 ? "GitHub rate limit hit, try again in a while" : `GitHub API ${res.status}`);
      const batch = await res.json();
      all.push(...batch);
      if (batch.length < 100) return all;
    }
  }

  // Keep only what the page needs, so the cache stays small.
  function toSites(repos) {
    return repos
      .filter(r => r.has_pages && r.name.toLowerCase() !== SELF && !(r.topics || []).includes("unlisted"))
      .map(r => ({
        name: r.name,
        description: r.description || "",
        url: /^https?:\/\//.test(r.homepage || "") ? r.homepage : `https://${SELF}/${r.name}/`,
        pushed_at: r.pushed_at,
      }))
      .sort((a, b) => b.pushed_at.localeCompare(a.pushed_at));
  }

  function render(sites) {
    listEl.replaceChildren(...sites.map(s => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "card";
      a.href = s.url;
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = s.name;
      a.append(name);
      if (s.description) {
        const desc = document.createElement("div");
        desc.className = "desc";
        desc.textContent = s.description;
        a.append(desc);
      }
      const meta = document.createElement("div");
      meta.className = "meta";
      const updated = new Date(s.pushed_at).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      meta.textContent = `${s.url.replace(/^https?:\/\//, "")} · updated ${updated}`;
      a.append(meta);
      li.append(a);
      return li;
    }));
    statusEl.hidden = sites.length > 0;
    statusEl.textContent = sites.length ? "" : "No Pages sites yet.";
  }

  async function load() {
    const cached = readCache();
    if (cached) return render(cached);
    statusEl.hidden = false;
    statusEl.textContent = "Loading…";
    try {
      const sites = toSites(await fetchRepos());
      writeCache(sites);
      render(sites);
    } catch (e) {
      statusEl.textContent = `Couldn't load the list: ${e.message}.`;
      const retry = document.createElement("button");
      retry.textContent = "Retry";
      retry.onclick = load;
      statusEl.append(retry);
    }
  }

  load();
</script>
</body>
</html>
