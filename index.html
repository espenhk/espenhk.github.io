<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>espenhk</title>
<meta name="description" content="Every GitHub Pages site published by espenhk">
<link rel="stylesheet" href="design/tokens.css">
<style>
  /* Colours, fonts and spacing come from Starfleet (design/tokens.css). */
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    padding: var(--space-2xl) var(--space-lg) calc(var(--space-2xl) + var(--space-lg));
    max-width: var(--container-narrow);
    background: var(--background);
    color: var(--text-primary);
    font-family: var(--body-font-family);
    font-size: var(--body-font-size);
    line-height: var(--body-line-height);
    font-weight: var(--body-font-weight);
  }
  h1 {
    font-family: var(--display-section-font-family);
    font-size: var(--display-section-font-size);
    line-height: var(--display-section-line-height);
    font-weight: var(--display-section-font-weight);
    letter-spacing: var(--display-section-letter-spacing);
    margin: 0 0 var(--space-xs);
  }
  p.sub { color: var(--text-secondary); margin: 0 0 var(--space-2xl); }
  ul { list-style: none; padding: 0; margin: 0; }
  li + li { margin-top: var(--space-md); }
  a.card {
    display: block;
    padding: var(--space-lg);
    border: 1px solid var(--card-edge);
    border-radius: var(--radius-md);
    background: var(--surface);
    text-decoration: none;
    color: var(--text-primary);
  }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); }
  a.card:active { background: var(--accent-tint); }
  .name {
    font-family: var(--label-strong-font-family);
    font-weight: var(--label-strong-font-weight);
    font-size: var(--lead-font-size);
    line-height: var(--label-strong-line-height);
    overflow-wrap: anywhere;
  }
  .desc {
    color: var(--text-secondary);
    font-size: var(--small-font-size);
    line-height: var(--small-line-height);
    margin-top: var(--space-xs);
  }
  .meta {
    color: var(--meta-ink);
    font-family: var(--mono-meta-font-family);
    font-size: var(--mono-meta-font-size);
    line-height: var(--mono-meta-line-height);
    margin-top: var(--space-tight);
    overflow-wrap: anywhere;
  }
  .status { color: var(--text-secondary); }
  .status button {
    font-family: var(--button-font-family);
    font-size: var(--button-font-size);
    font-weight: var(--button-font-weight);
    line-height: var(--button-line-height);
    margin-left: var(--space-sm);
    padding: var(--space-tight) var(--space-md);
    border: 1px solid var(--control-edge);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-primary);
  }
  footer {
    margin-top: calc(var(--space-2xl) + var(--space-sm));
    color: var(--text-secondary);
    font-size: var(--small-font-size);
    line-height: var(--small-line-height);
  }
  footer a { color: var(--accent-ink); }
  code { font-family: var(--font-mono); font-size: 0.95em; }
</style>
</head>
<body>
<h1>espenhk</h1>
<p class="sub">Sites published with GitHub Pages. Tap one to open it.</p>
<p class="status" id="status">Loading…</p>
<ul id="sites"></ul>
<footer>
  This list builds itself from every public repo with Pages turned on.
  Add the topic <code>unlisted</code> to a repo to hide it.
  <br><a href="https://github.com/espenhk">github.com/espenhk</a>
</footer>
<script>
  const USER = "espenhk";
  const SELF = `${USER}.github.io`;
  const CACHE_KEY = "ghio:repos";
  // Short enough that a newly enabled site shows up on the next visit.
  const FRESH_MS = 2 * 60 * 1000;

  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("sites");

  function readCache() {
    try {
      const hit = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (hit && Array.isArray(hit.repos)) return hit;
    } catch (e) {}
    return null;
  }

  function writeCache(repos) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), repos })); } catch (e) {}
  }

  async function fetchRepos() {
    const all = [];
    for (let page = 1; ; page++) {
      const res = await fetch(`https://api.github.com/users/${USER}/repos?per_page=100&page=${page}`,
                              { headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) throw new Error(res.status === 403 ? "GitHub rate limit hit, try again in a while" : `GitHub API ${res.status}`);
      const batch = await res.json();
      all.push(...batch);
      if (batch.length < 100) return all;
    }
  }

  // Keep only what the page needs, so the cache stays small.
  function toSites(repos) {
    return repos
      .filter(r => r.has_pages && r.name.toLowerCase() !== SELF && !(r.topics || []).includes("unlisted"))
      .map(r => ({
        name: r.name,
        description: r.description || "",
        url: /^https?:\/\//.test(r.homepage || "") ? r.homepage : `https://${SELF}/${r.name}/`,
        pushed_at: r.pushed_at,
      }))
      .sort((a, b) => b.pushed_at.localeCompare(a.pushed_at));
  }

  function render(sites) {
    listEl.replaceChildren(...sites.map(s => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "card";
      a.href = s.url;
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = s.name;
      a.append(name);
      if (s.description) {
        const desc = document.createElement("div");
        desc.className = "desc";
        desc.textContent = s.description;
        a.append(desc);
      }
      const meta = document.createElement("div");
      meta.className = "meta";
      const updated = new Date(s.pushed_at).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      meta.textContent = `${s.url.replace(/^https?:\/\//, "")} · updated ${updated}`;
      a.append(meta);
      li.append(a);
      return li;
    }));
    statusEl.hidden = sites.length > 0;
    statusEl.textContent = sites.length ? "" : "No Pages sites yet.";
  }

  // Show the cached list at once, then refresh it, so a new site never waits on a stale cache.
  async function load() {
    const cached = readCache();
    if (cached) {
      render(cached.repos);
      if (Date.now() - cached.at < FRESH_MS) return;
    } else {
      statusEl.hidden = false;
      statusEl.textContent = "Loading…";
    }
    try {
      const sites = toSites(await fetchRepos());
      writeCache(sites);
      render(sites);
    } catch (e) {
      if (cached) return;
      statusEl.textContent = `Couldn't load the list: ${e.message}.`;
      const retry = document.createElement("button");
      retry.textContent = "Retry";
      retry.onclick = load;
      statusEl.append(retry);
    }
  }

  load();
</script>
</body>
</html>
